<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-labelledby="plannerMockTitle">
  <!-- PLACEHOLDER ARTWORK: replace this whole file with a real photo/mockup of the printed "Fika med Hannah" study planner (recommended portrait image, ~480x560 or similar ratio). Keep the filename "planner-mockup.svg" or update the src in index.html if you switch to .png/.jpg. -->
  <title id="plannerMockTitle">Mockup of the printable Fika med Hannah 12-week Swedish study planner cover</title>

  <ellipse cx="240" cy="500" rx="170" ry="20" fill="#8f6b60" opacity="0.12"/>

  <!-- back sheet peeking out -->
  <rect x="60" y="40" width="340" height="460" rx="18" fill="#eceafc" transform="rotate(-4 240 270)"/>

  <!-- planner cover -->
  <rect x="70" y="30" width="340" height="460" rx="18" fill="#fffaf7" stroke="#8f6b60" stroke-width="5"/>
  <rect x="70" y="30" width="26" height="460" rx="13" fill="#dec5bb"/>

  <!-- ribbon bookmark -->
  <path d="M330 30v90l-20-16-20 16V30z" fill="#b58b7f"/>

  <!-- title lockup -->
  <text x="250" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#8f6b60" font-weight="700">Min Svenska</text>
  <text x="250" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#b58b7f">12-Week Study Planner</text>

  <!-- little mug icon -->
  <circle cx="250" cy="240" r="34" fill="#fdeeec"/>
  <path d="M234 232h32v16c0 8-6 14-16 14s-16-6-16-14v-16z" fill="#fffaf7" stroke="#8f6b60" stroke-width="3"/>
  <path d="M266 236h5c5 0 9 4 9 9s-4 9-9 9h-5" fill="none" stroke="#8f6b60" stroke-width="3"/>

  <!-- placeholder text lines -->
  <rect x="130" y="300" width="240" height="10" rx="5" fill="#f6ece7"/>
  <rect x="130" y="322" width="200" height="10" rx="5" fill="#f6ece7"/>
  <rect x="130" y="344" width="220" height="10" rx="5" fill="#f6ece7"/>

  <!-- week badge -->
  <rect x="150" y="400" width="180" height="46" rx="23" fill="#e3ebd9"/>
  <text x="240" y="428" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5c6b4d">Weeks 1&#8211;12</text>
</svg>
